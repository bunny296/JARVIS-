name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the Jarvis project
        run: |
          mkdir -p "$(dirname jarvis-app/app/build.gradle.kts)"
          cat > jarvis-app/app/build.gradle.kts <<'JARVIS_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.jarvis"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.jarvis"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              // Fixed signing key so every build can update the previous one
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              // Keep model files uncompressed so they copy out of assets quickly
              androidResources {
                  noCompress += listOf("mdl", "fst", "conf", "int", "txt", "mat", "stats", "dubm", "ie", "json")
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("net.java.dev.jna:jna:5.13.0@aar")
              implementation("com.alphacephei:vosk-android:0.3.47@aar")
          }
          JARVIS_EOF
          mkdir -p "$(dirname jarvis-app/app/src/main/AndroidManifest.xml)"
          cat > jarvis-app/app/src/main/AndroidManifest.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <queries>
                  <!-- Find the phone's text-to-speech engine -->
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
                  <!-- List launchable apps so Jarvis can open them by name -->
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Jarvis"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".JarvisService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          JARVIS_EOF
          mkdir -p "$(dirname jarvis-app/app/src/main/java/com/example/jarvis/JarvisService.kt)"
          cat > jarvis-app/app/src/main/java/com/example/jarvis/JarvisService.kt <<'JARVIS_EOF'
          package com.example.jarvis

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.media.RingtoneManager
          import android.media.ToneGenerator
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.ContactsContract
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.telephony.SmsManager
          import androidx.core.app.ServiceCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import org.vosk.Model
          import org.vosk.Recognizer
          import org.vosk.android.RecognitionListener
          import org.vosk.android.SpeechService
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          class JarvisService : Service(), RecognitionListener {

              private enum class Mode { WAKE, COMMAND, CONFIRM, SWITCHING, THINKING }

              private class Pending(val run: () -> String)

              companion object {
                  // If Google renames this model, change it here
                  const val GEMINI_MODEL = "gemini-flash-latest"
              }

              private val main = Handler(Looper.getMainLooper())
              private var model: Model? = null
              private var wakeRec: Recognizer? = null      // only knows "jarvis"
              private var commandRec: Recognizer? = null   // full vocabulary
              private var confirmRec: Recognizer? = null   // only yes / no
              private var speechService: SpeechService? = null
              private var mode = Mode.SWITCHING
              private var lastTrigger = 0L

              private var tts: TextToSpeech? = null
              private var ttsReady = false
              @Volatile private var speechId = 0
              private var afterSpeech: (() -> Unit)? = null
              private var pending: Pending? = null

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("jarvis_listen", "Jarvis listening", NotificationManager.IMPORTANCE_LOW)
                  )
                  nm.createNotificationChannel(
                      NotificationChannel("jarvis_alert", "Jarvis alerts", NotificationManager.IMPORTANCE_HIGH)
                  )
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.language = Locale.US
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}
                              override fun onDone(utteranceId: String?) { speechEnded(utteranceId) }
                              @Deprecated("Deprecated in Java")
                              override fun onError(utteranceId: String?) { speechEnded(utteranceId) }
                          })
                          ttsReady = true
                      }
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  ServiceCompat.startForeground(
                      this, 1, listeningNotification("Loading speech model..."),
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                  )
                  if (model == null) {
                      Thread {
                          try {
                              val modelDir = copyModelFromAssets()
                              val m = Model(modelDir.absolutePath)
                              model = m
                              wakeRec = Recognizer(m, 16000.0f, "[\"jarvis\", \"[unk]\"]")
                              commandRec = Recognizer(m, 16000.0f)
                              confirmRec = Recognizer(
                                  m, 16000.0f,
                                  "[\"yes\", \"yeah\", \"yep\", \"sure\", \"okay\", \"no\", \"cancel\", \"stop\", \"[unk]\"]"
                              )
                              main.post { startWakeListening() }
                          } catch (e: Exception) {
                              update("Error: ${e.message}")
                          }
                      }.start()
                  }
                  return START_STICKY
              }

              // ---------- mode switching ----------

              // Stop the reader thread BEFORE releasing the microphone, otherwise the app crashes
              private fun releaseService() {
                  try { speechService?.stop() } catch (e: Exception) { }
                  try { speechService?.shutdown() } catch (e: Exception) { }
                  speechService = null
              }

              private fun startWakeListening() {
                  mode = Mode.SWITCHING
                  releaseService()
                  wakeRec?.reset()
                  speechService = SpeechService(wakeRec, 16000.0f).also { it.startListening(this) }
                  // Posted so any late callbacks from the old listener are ignored first
                  main.post { mode = Mode.WAKE }
                  update("Listening for \"Jarvis\"")
              }

              private fun startCommandListening() {
                  mode = Mode.SWITCHING
                  releaseService()
                  commandRec?.reset()
                  // Stop automatically after 8 seconds if nothing is said
                  speechService = SpeechService(commandRec, 16000.0f).also { it.startListening(this, 8000) }
                  main.post { mode = Mode.COMMAND }
                  update("Listening for your command...")
              }

              private fun startConfirmListening() {
                  mode = Mode.SWITCHING
                  releaseService()
                  confirmRec?.reset()
                  speechService = SpeechService(confirmRec, 16000.0f).also { it.startListening(this, 6000) }
                  main.post { mode = Mode.CONFIRM }
                  update("Say yes or no")
              }

              private fun finishCommand(text: String) {
                  if (mode != Mode.COMMAND) return
                  mode = Mode.SWITCHING
                  if (text.isBlank()) {
                      showAlert("I didn't catch that.")
                      main.post { startWakeListening() }
                      return
                  }
                  showAlert("You said: \"$text\"")
                  main.post {
                      releaseService()          // free the microphone while Jarvis thinks and talks
                      mode = Mode.THINKING
                      update("Thinking...")
                      askGemini(text)
                  }
              }

              private fun finishConfirm(text: String) {
                  if (mode != Mode.CONFIRM) return
                  mode = Mode.SWITCHING
                  val words = text.lowercase().split(" ")
                  val yes = listOf("yes", "yeah", "yep", "sure", "okay").any { words.contains(it) }
                  val p = pending
                  pending = null
                  main.post {
                      releaseService()
                      mode = Mode.THINKING
                      if (yes && p != null) {
                          val result = try { p.run() } catch (e: Exception) { "Sorry, that didn't work." }
                          speak(result)
                      } else {
                          speak("Okay, cancelled.")
                      }
                  }
              }

              // ---------- speaking ----------

              private fun speak(text: String, then: (() -> Unit)? = null) {
                  val clean = text.replace("*", "").replace("#", "").replace("`", "").trim()
                  showAlert("Jarvis: ${clean.take(200)}")
                  afterSpeech = then
                  if (ttsReady && clean.isNotEmpty()) {
                      applyVoice()
                      val id = ++speechId
                      tts?.speak(clean, TextToSpeech.QUEUE_FLUSH, null, "r$id")
                      // Safety net in case speech never reports completion
                      main.postDelayed({ if (id == speechId) finishSpeech() }, 45000)
                  } else {
                      finishSpeech()
                  }
              }

              private fun speechEnded(utteranceId: String?) {
                  val id = utteranceId?.removePrefix("r")?.toIntOrNull()
                  if (id != null && id == speechId) main.post { finishSpeech() }
              }

              private fun finishSpeech() {
                  if (mode != Mode.THINKING) return
                  val next = afterSpeech
                  afterSpeech = null
                  if (next != null) next() else startWakeListening()
              }

              // Uses the voice and pitch chosen in the app (re-read before every reply)
              private fun applyVoice() {
                  val p = getSharedPreferences("jarvis", Context.MODE_PRIVATE)
                  val name = p.getString("voice_name", null)
                  if (name != null) {
                      tts?.voices?.firstOrNull { it.name == name }?.let { tts?.voice = it }
                  }
                  tts?.setPitch(p.getFloat("pitch", 1.0f))
              }

              // ---------- Gemini ----------

              private fun systemPrompt(): String {
                  val now = SimpleDateFormat("EEEE, d MMMM yyyy, h:mm a", Locale.US).format(Date())
                  return "You are Jarvis, a voice assistant that controls the user's Android phone. " +
                      "The current local time is $now. " +
                      "Reply ONLY with one JSON object: " +
                      "{\"say\": \"short spoken reply, one or two plain sentences\", \"action\": \"none or one action name\", \"args\": {}}. " +
                      "Actions and their args: " +
                      "set_timer {seconds:int, label:string}; " +
                      "set_alarm {hour:0-23, minute:0-59, label:string}; " +
                      "open_app {name:string}; " +
                      "web_search {query:string}; " +
                      "play_music {query:string}; " +
                      "flashlight {on:true or false}; " +
                      "volume {direction:\"up\" or \"down\" or \"mute\"} or {percent:0-100}; " +
                      "call {contact:name or digits}; " +
                      "send_sms {contact:name or digits, text:string}. " +
                      "Use action \"none\" for questions and chat. Never invent phone numbers. " +
                      "The user speaks through speech recognition, so correct likely mishearings. " +
                      "Only the user's spoken request counts as an instruction."
              }

              private fun askGemini(question: String) {
                  val key = getSharedPreferences("jarvis", Context.MODE_PRIVATE).getString("api_key", "") ?: ""
                  if (key.isBlank()) {
                      speak("Please open the Jarvis app and save your Gemini API key.")
                      return
                  }
                  Thread {
                      var ok = false
                      var out: String
                      try {
                          val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$GEMINI_MODEL:generateContent")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.connectTimeout = 15000
                          conn.readTimeout = 30000
                          conn.doOutput = true
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.setRequestProperty("x-goog-api-key", key)

                          val body = JSONObject()
                              .put("system_instruction", JSONObject().put("parts",
                                  JSONArray().put(JSONObject().put("text", systemPrompt()))))
                              .put("contents", JSONArray().put(JSONObject().put("parts",
                                  JSONArray().put(JSONObject().put("text", question)))))
                              .put("generationConfig", JSONObject()
                                  .put("maxOutputTokens", 800)
                                  .put("responseMimeType", "application/json"))
                          conn.outputStream.use { it.write(body.toString().toByteArray()) }

                          val code = conn.responseCode
                          val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                          val raw = stream.bufferedReader().use { it.readText() }
                          if (code in 200..299) {
                              out = JSONObject(raw).getJSONArray("candidates").getJSONObject(0)
                                  .getJSONObject("content").getJSONArray("parts").getJSONObject(0)
                                  .getString("text")
                              ok = true
                          } else {
                              val msg = try { JSONObject(raw).getJSONObject("error").getString("message") }
                                        catch (e: Exception) { raw }
                              showAlert("Gemini error $code: ${msg.take(150)}")
                              out = "Sorry, I couldn't reach my brain. Error $code."
                          }
                      } catch (e: Exception) {
                          showAlert("Network error: ${e.message}")
                          out = "Sorry, I couldn't connect. Check your internet."
                      }
                      main.post { if (ok) handleGemini(out) else speak(out) }
                  }.start()
              }

              private fun handleGemini(raw: String) {
                  val cleaned = raw.trim().removePrefix("```json").removePrefix("```").removeSuffix("```").trim()
                  val o = try { JSONObject(cleaned) } catch (e: Exception) { null }
                  if (o == null) {
                      speak(raw)   // not JSON, just talk
                      return
                  }
                  val say = o.optString("say", "")
                  val action = if (o.isNull("action")) "none" else o.optString("action", "none")
                  val args = o.optJSONObject("args") ?: JSONObject()
                  try {
                      doAction(say, action, args)
                  } catch (e: Exception) {
                      showAlert("Action error: ${e.message}")
                      speak("Sorry, that didn't work.")
                  }
              }

              // ---------- actions ----------

              private fun doAction(say: String, action: String, args: JSONObject) {
                  when (action) {
                      "set_timer" -> {
                          val secs = args.optInt("seconds", 0)
                          if (secs <= 0) { speak("How long should the timer be?"); return }
                          val label = args.optString("label", "Timer").ifBlank { "Timer" }
                          main.postDelayed({ ring("$label is up") }, secs * 1000L)
                          speak(say.ifBlank { "Timer set." })
                      }
                      "set_alarm" -> {
                          val h = args.optInt("hour", -1)
                          val m = args.optInt("minute", 0)
                          if (h !in 0..23 || m !in 0..59) { speak("What time should I set the alarm for?"); return }
                          val cal = Calendar.getInstance().apply {
                              set(Calendar.HOUR_OF_DAY, h); set(Calendar.MINUTE, m)
                              set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                              if (timeInMillis <= System.currentTimeMillis()) add(Calendar.DAY_OF_YEAR, 1)
                          }
                          val label = args.optString("label", "Alarm").ifBlank { "Alarm" }
                          main.postDelayed({ ring("$label time") }, cal.timeInMillis - System.currentTimeMillis())
                          speak(say.ifBlank { "Alarm set." })
                      }
                      "open_app" -> {
                          val name = args.optString("name", "")
                          if (openApp(name)) speak(say.ifBlank { "Opening $name." })
                          else speak("I couldn't find $name on this phone.")
                      }
                      "web_search" -> {
                          val q = args.optString("query", "")
                          launch(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + Uri.encode(q))))
                          speak(say.ifBlank { "Searching for $q." })
                      }
                      "play_music" -> {
                          val q = args.optString("query", "")
                          launch(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(q))))
                          speak(say.ifBlank { "Looking up $q." })
                      }
                      "flashlight" -> {
                          val on = args.optBoolean("on", true)
                          if (setTorch(on)) speak(say.ifBlank { if (on) "Flashlight on." else "Flashlight off." })
                          else speak("I couldn't control the flashlight.")
                      }
                      "volume" -> {
                          setVolume(args)
                          speak(say.ifBlank { "Done." })
                      }
                      "call" -> {
                          val who = args.optString("contact", "")
                          val c = resolveContact(who)
                          if (c == null) { speak(contactProblem(who)); return }
                          if (checkSelfPermission(Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED) {
                              speak("Please allow the phone permission in the Jarvis app."); return
                          }
                          confirm("Shall I call ${c.first}?") {
                              launch(Intent(Intent.ACTION_CALL, Uri.fromParts("tel", c.second, null)))
                              "Calling ${c.first}."
                          }
                      }
                      "send_sms" -> {
                          val who = args.optString("contact", "")
                          val text = args.optString("text", "")
                          if (text.isBlank()) { speak("What should the message say?"); return }
                          val c = resolveContact(who)
                          if (c == null) { speak(contactProblem(who)); return }
                          if (checkSelfPermission(Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED) {
                              speak("Please allow the SMS permission in the Jarvis app."); return
                          }
                          confirm("Shall I text ${c.first}: $text?") {
                              sendSms(c.second, text)
                              "Message sent to ${c.first}."
                          }
                      }
                      else -> speak(say.ifBlank { "Sorry, I didn't get that." })
                  }
              }

              // Speak a question, then listen for yes/no. Risky actions always go through here.
              private fun confirm(prompt: String, run: () -> String) {
                  pending = Pending(run)
                  speak(prompt) { startConfirmListening() }
              }

              private fun ring(text: String) {
                  showAlert(text)
                  try {
                      val r = RingtoneManager.getRingtone(this, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM))
                      r.play()
                      main.postDelayed({ try { r.stop() } catch (e: Exception) { } }, 8000)
                  } catch (e: Exception) { }
                  if (ttsReady) {
                      applyVoice()
                      tts?.speak(text, TextToSpeech.QUEUE_ADD, null, "timer")
                  }
              }

              // Tries to open the screen directly; also posts a tap-to-open notification as a fallback,
              // because Android can block apps from opening screens while in the background.
              private fun launch(i: Intent) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  try { startActivity(i) } catch (e: Exception) { }
                  try {
                      val pi = PendingIntent.getActivity(
                          this, i.hashCode(), i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      val n = Notification.Builder(this, "jarvis_alert")
                          .setContentTitle("Jarvis")
                          .setContentText("Tap to open")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .build()
                      getSystemService(NotificationManager::class.java).notify(3, n)
                  } catch (e: Exception) { }
              }

              private fun openApp(name: String): Boolean {
                  val q = name.lowercase().trim()
                  if (q.isEmpty()) return false
                  val pm = packageManager
                  val apps = pm.queryIntentActivities(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0
                  )
                  val match = apps.firstOrNull { it.loadLabel(pm).toString().lowercase() == q }
                      ?: apps.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(q) }
                      ?: return false
                  val i = pm.getLaunchIntentForPackage(match.activityInfo.packageName) ?: return false
                  launch(i)
                  return true
              }

              private fun setTorch(on: Boolean): Boolean {
                  return try {
                      val cm = getSystemService(CameraManager::class.java)
                      val id = cm.cameraIdList.firstOrNull {
                          cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      } ?: return false
                      cm.setTorchMode(id, on)
                      true
                  } catch (e: Exception) { false }
              }

              private fun setVolume(args: JSONObject) {
                  val am = getSystemService(AudioManager::class.java)
                  val max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                  val percent = args.optInt("percent", -1)
                  if (percent >= 0) {
                      am.setStreamVolume(AudioManager.STREAM_MUSIC, max * percent.coerceAtMost(100) / 100, 0)
                      return
                  }
                  when (args.optString("direction", "")) {
                      "up" -> repeat(2) { am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, 0) }
                      "down" -> repeat(2) { am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, 0) }
                      "mute" -> am.setStreamVolume(AudioManager.STREAM_MUSIC, 0, 0)
                  }
              }

              // Returns (display name, phone number) or null
              private fun resolveContact(who: String): Pair<String, String>? {
                  val q = who.trim()
                  if (q.isEmpty()) return null
                  if (Regex("^[+0-9 ()-]+$").matches(q)) return Pair(q, q.replace(Regex("[ ()-]"), ""))
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) return null
                  contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      ),
                      "${ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME} LIKE ?",
                      arrayOf("%$q%"),
                      null
                  )?.use { c ->
                      if (c.moveToFirst()) return Pair(c.getString(0), c.getString(1))
                  }
                  return null
              }

              private fun contactProblem(who: String): String =
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED)
                      "Please allow the contacts permission in the Jarvis app."
                  else "I couldn't find $who in your contacts."

              @Suppress("DEPRECATION")
              private fun sendSms(number: String, text: String) {
                  val sm: SmsManager = if (Build.VERSION.SDK_INT >= 31) getSystemService(SmsManager::class.java)
                                       else SmsManager.getDefault()
                  sm.sendMultipartTextMessage(number, null, sm.divideMessage(text), null, null)
              }

              // ---------- Vosk callbacks ----------

              override fun onPartialResult(hypothesis: String?) {
                  if (mode == Mode.WAKE && hypothesis != null && textOf(hypothesis, "partial").contains("jarvis")) {
                      val now = System.currentTimeMillis()
                      if (now - lastTrigger < 3000) return
                      lastTrigger = now
                      beepAndVibrate()
                      main.post { startCommandListening() }
                      mode = Mode.SWITCHING
                  }
              }

              override fun onResult(hypothesis: String?) { routeResult(hypothesis) }
              override fun onFinalResult(hypothesis: String?) { routeResult(hypothesis) }

              private fun routeResult(hypothesis: String?) {
                  if (hypothesis == null) return
                  when (mode) {
                      Mode.COMMAND -> finishCommand(textOf(hypothesis, "text"))
                      Mode.CONFIRM -> finishConfirm(textOf(hypothesis, "text"))
                      else -> {}
                  }
              }

              override fun onTimeout() {
                  when (mode) {
                      Mode.COMMAND -> finishCommand("")
                      Mode.CONFIRM -> finishConfirm("")
                      else -> {}
                  }
              }

              override fun onError(exception: Exception?) {
                  update("Error: ${exception?.message}")
              }

              // ---------- helpers ----------

              private fun textOf(json: String, key: String): String =
                  try { JSONObject(json).optString(key) } catch (e: Exception) { "" }

              private fun beepAndVibrate() {
                  ToneGenerator(AudioManager.STREAM_NOTIFICATION, 100).startTone(ToneGenerator.TONE_PROP_BEEP)
                  val vib = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  vib.vibrate(VibrationEffect.createOneShot(200, VibrationEffect.DEFAULT_AMPLITUDE))
              }

              private fun showAlert(text: String) {
                  val n = Notification.Builder(this, "jarvis_alert")
                      .setContentTitle("Jarvis")
                      .setContentText(text)
                      .setStyle(Notification.BigTextStyle().bigText(text))
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setAutoCancel(true)
                      .build()
                  getSystemService(NotificationManager::class.java).notify(2, n)
              }

              private fun listeningNotification(text: String): Notification =
                  Notification.Builder(this, "jarvis_listen")
                      .setContentTitle("Jarvis")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .build()

              private fun update(text: String) {
                  getSystemService(NotificationManager::class.java).notify(1, listeningNotification(text))
              }

              private fun copyModelFromAssets(): File {
                  val target = File(filesDir, "model")
                  if (File(target, "am/final.mdl").exists()) return target
                  target.deleteRecursively()
                  copyAssetDir("model-en-us", target)
                  return target
              }

              private fun copyAssetDir(assetPath: String, dest: File) {
                  val children = assets.list(assetPath) ?: emptyArray()
                  if (children.isEmpty()) {
                      dest.parentFile?.mkdirs()
                      assets.open(assetPath).use { input ->
                          FileOutputStream(dest).use { out -> input.copyTo(out) }
                      }
                  } else {
                      dest.mkdirs()
                      for (child in children) copyAssetDir("$assetPath/$child", File(dest, child))
                  }
              }

              override fun onDestroy() {
                  mode = Mode.SWITCHING
                  releaseService()
                  tts?.stop()
                  tts?.shutdown()
                  wakeRec?.close()
                  commandRec?.close()
                  confirmRec?.close()
                  model?.close()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          JARVIS_EOF
          mkdir -p "$(dirname jarvis-app/app/src/main/java/com/example/jarvis/MainActivity.kt)"
          cat > jarvis-app/app/src/main/java/com/example/jarvis/MainActivity.kt <<'JARVIS_EOF'
          package com.example.jarvis

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import android.widget.ScrollView
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import android.text.InputType
          import android.view.Gravity
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var keyBox: EditText

              private fun prefs() = getSharedPreferences("jarvis", Context.MODE_PRIVATE)

              private var previewTts: TextToSpeech? = null
              private var previewReady = false

              // English voices installed on this phone, in a stable order
              private fun englishVoices() =
                  (previewTts?.voices ?: emptySet())
                      .filter { it.locale.language == "en" }
                      .sortedBy { it.name }

              private fun speakSample() {
                  val voices = englishVoices()
                  if (!previewReady || voices.isEmpty()) {
                      status.text = "No voices found yet. Try again in a moment."
                      return
                  }
                  val next = (prefs().getInt("voice_index", -1) + 1) % voices.size
                  val v = voices[next]
                  prefs().edit().putInt("voice_index", next).putString("voice_name", v.name).apply()
                  previewTts?.voice = v
                  previewTts?.setPitch(prefs().getFloat("pitch", 1.0f))
                  status.text = "Voice ${next + 1} of ${voices.size}\n(${v.name})"
                  previewTts?.speak(
                      "Hello, I am Jarvis. This is voice ${next + 1}.",
                      TextToSpeech.QUEUE_FLUSH, null, "preview"
                  )
              }

              override fun onDestroy() {
                  previewTts?.shutdown()
                  super.onDestroy()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  previewTts = TextToSpeech(this) { s -> previewReady = (s == TextToSpeech.SUCCESS) }

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                  }
                  status = TextView(this).apply {
                      text = if (prefs().getString("api_key", "").isNullOrBlank())
                          "Jarvis is off\nPaste your Gemini API key below"
                      else "Jarvis is off\nAPI key saved"
                      textSize = 18f
                      gravity = Gravity.CENTER
                  }
                  keyBox = EditText(this).apply {
                      hint = "Gemini API key"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setSingleLine(true)
                  }
                  val save = Button(this).apply {
                      text = "Save key"
                      setOnClickListener {
                          val k = keyBox.text.toString().trim()
                          if (k.isNotEmpty()) {
                              prefs().edit().putString("api_key", k).apply()
                              keyBox.setText("")
                              status.text = "API key saved"
                          }
                      }
                  }
                  val start = Button(this).apply {
                      text = "Start Jarvis"
                      setOnClickListener { startJarvis() }
                  }
                  val stop = Button(this).apply {
                      text = "Stop Jarvis"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, JarvisService::class.java))
                          status.text = "Jarvis is off"
                      }
                  }
                  val voiceBtn = Button(this).apply {
                      text = "Change voice"
                      setOnClickListener { speakSample() }
                  }
                  val pitchBtn = Button(this).apply {
                      fun label() = if (prefs().getFloat("pitch", 1.0f) < 1.0f) "Deeper pitch: ON" else "Deeper pitch: OFF"
                      text = label()
                      setOnClickListener {
                          val deeper = prefs().getFloat("pitch", 1.0f) < 1.0f
                          prefs().edit().putFloat("pitch", if (deeper) 1.0f else 0.8f).apply()
                          text = label()
                          speakSample()
                      }
                  }
                  layout.addView(status)
                  layout.addView(keyBox)
                  layout.addView(save)
                  layout.addView(start)
                  layout.addView(stop)
                  val overlayBtn = Button(this).apply {
                      text = "Allow display over apps"
                      setOnClickListener {
                          startActivity(
                              Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                          )
                      }
                  }
                  layout.addView(voiceBtn)
                  layout.addView(pitchBtn)
                  layout.addView(overlayBtn)
                  setContentView(ScrollView(this).apply { addView(layout) })
              }

              private fun startJarvis() {
                  val needed = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.SEND_SMS
                  )
                  if (Build.VERSION.SDK_INT >= 33) needed.add(Manifest.permission.POST_NOTIFICATIONS)
                  val missing = needed.filter {
                      checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      requestPermissions(missing.toTypedArray(), 1)
                  } else {
                      launchService()
                  }
              }

              private fun launchService() {
                  startForegroundService(Intent(this, JarvisService::class.java))
                  status.text = "Jarvis is listening...\nSay \"Jarvis\""
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int, permissions: Array<out String>, grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      launchService()
                  } else {
                      status.text = "Microphone permission is required"
                  }
              }
          }
          JARVIS_EOF
          mkdir -p "$(dirname jarvis-app/build.gradle.kts)"
          cat > jarvis-app/build.gradle.kts <<'JARVIS_EOF'
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          JARVIS_EOF
          mkdir -p "$(dirname jarvis-app/gradle.properties)"
          cat > jarvis-app/gradle.properties <<'JARVIS_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          JARVIS_EOF
          mkdir -p "$(dirname jarvis-app/settings.gradle.kts)"
          cat > jarvis-app/settings.gradle.kts <<'JARVIS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Jarvis"
          include(":app")
          JARVIS_EOF

      - name: Download offline speech model
        run: |
          cd jarvis-app
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          rm model.zip

      - name: Install fixed signing key (so updates install over old versions)
        run: |
          echo "" | base64 -d > jarvis-app/app/debug.keystore
          ls -l jarvis-app/app/debug.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: jarvis-app
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis-app/app/build/outputs/apk/debug/app-debug.apk
          
